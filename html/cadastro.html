<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Cadastro</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form id="form-cadastro">
            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required maxlength="100">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required maxlength="100">

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}">

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" required pattern="[0-9]{5}-[0-9]{3}">

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>

                <label for="numero">Número:</label>
                <input type="number" id="numero" name="numero" required min="1">

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <label for="estado">Estado:</label>
                <select id="estado" name="estado" required>
                <option value="">Selecione seu estado</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Interesse em apoiar a ONG</legend>

                <label for="apoio">Como deseja apoiar?</label>
                <select id="apoio" name="apoio" required>
                    <option value="">Selecione uma opção</option>
                    <option value="voluntariado">Voluntariado</option>
                    <option value="doacao">Doação</option>
                    <option value="ambos">Voluntariado e doação</option>
                </select>
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" cols="40"></textarea>
                <label for="disponibilidade">Disponibilidade semanal:</label>
                <select id="disponibilidade" name="disponibilidade" required>
                    <option value="">Selecione uma opção</option>
                    <option value="1-3">1 a 3 horas</option>
                    <option value="4-6">4 a 6 horas</option>
                    <option value="7-10">7 a 10 horas</option>
                    <option value="mais-10">Mais de 10 horas</option>
                </select>
            </fieldset>
            <button type="submit">Enviar cadastro</button>
            <p id="mensagem-sucesso"></p>
        </form>

    </main>

    <footer>
    <p>ONG Guardiões da Fauna</p>
    <p>E-mail: ongguardioesdafauna@email.com</p>
    <p>Telefone: (11) 99999-8888</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
